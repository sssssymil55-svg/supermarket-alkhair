<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الملك شوب - التطبيق الرسمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            font-family: 'Cairo', sans-serif; 
            background-color: #0f172a; 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            min-height: 100vh;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 flex flex-col min-h-screen pb-24">

    <!-- Status Bar -->
    <div class="bg-[#0b1120] px-6 py-2.5 flex justify-between items-center text-xs font-semibold text-slate-400 select-none border-b border-slate-800/40">
        <span id="live-time">9:41</span>
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-signal text-[11px]"></i>
            <i class="fa-solid fa-wifi text-[11px]"></i>
            <i class="fa-solid fa-battery-full text-emerald-400 text-sm"></i>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-[#0f172a]/95 backdrop-blur-md px-5 py-3.5 flex items-center justify-between border-b border-slate-800/60 sticky top-0 z-40 select-none">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-2xl bg-indigo-500/15 border border-indigo-500/30 flex items-center justify-center text-indigo-400 text-xl font-black shadow-inner">
                👑
            </div>
            <div>
                <h1 class="font-black text-base tracking-wide text-white leading-tight">الملك شوب</h1>
                <p class="text-[11px] text-indigo-400 font-medium">التطبيق الرسمي للمتجر</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="switchTab('cart')" class="relative p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-200 transition">
                <i class="fa-solid fa-cart-shopping text-sm"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 bg-indigo-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow">2</span>
            </button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-1 p-4 max-w-lg mx-auto w-full">
        <!-- Dynamic Content -->
    </main>

    <!-- Checkout Modal Overlay -->
    <div id="checkout-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#0f172a] border border-slate-800 w-full max-w-sm rounded-3xl p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-black text-sm text-indigo-400 flex items-center gap-2">
                    <i class="fa-solid fa-truck-fast"></i> إتمام بيانات التوصيل
                </h3>
                <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="text-[11px] text-slate-300 block mb-1 font-semibold">رقم الموبايل:</label>
                    <input type="tel" id="customer-phone" placeholder="07xxxxxxxxx" class="w-full bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-300 block mb-1 font-semibold">العنوان التفصيلي:</label>
                    <input type="text" id="customer-address" placeholder="المدينة، الحي، الشارع، الدار" class="w-full bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="text-[11px] text-slate-300 block mb-1 font-semibold">أقرب نقطة دالة:</label>
                    <input type="text" id="customer-landmark" placeholder="مستشفى، جامع، تقاطع شهير..." class="w-full bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>
            <button onclick="submitOrderWithDetails()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg mt-2">تأكيد وإرسال الطلب</button>
        </div>
    </div>

    <!-- Fixed Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0f172a] border-t-2 border-indigo-500/40 px-4 py-2.5 flex justify-around items-center z-40 select-none shadow-2xl max-w-lg mx-auto">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center gap-1 text-indigo-400 transition py-1 px-3 rounded-xl">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[11px] font-bold">الرئيسية</span>
        </button>
        <button onclick="switchTab('categories')" id="nav-categories" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white transition py-1 px-3 rounded-xl">
            <i class="fa-solid fa-grid-2 text-xl"></i>
            <span class="text-[11px] font-semibold">الأقسام</span>
        </button>
        <button onclick="switchTab('cart')" id="nav-cart" class="nav-btn flex flex-col items-center gap-1 text-slate-400 hover:text-white transition py-1 px-3 rounded-xl relative">
            <i class="fa-solid fa-bag-shopping text-xl"></i>
            <span class="text-[11px] font-semibold">السلة</span>
        </button>
        <button onclick="tryOpenAdmin()" id="nav-admin" class="nav-btn flex flex-col items-center gap-1 text-amber-400 hover:text-amber-300 transition py-1 px-4 rounded-xl bg-amber-500/10 border border-amber-500/30">
            <i class="fa-solid fa-lock text-xl"></i>
            <span class="text-[11px] font-black">الإدارة ⚙️</span>
        </button>
    </nav>

    <script>
        let currentTab = 'home';
        let isAdminLoggedIn = false;
        let adminPin = localStorage.getItem('almalik_admin_pin') || '1234';

        let cart = [
            { id: 1, name: 'آيفون 15 برو ماكس', price: 4500, qty: 1, image: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=300' },
            { id: 2, name: 'ساعة ذكية رويال', price: 850, qty: 1, image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300' }
        ];

        let categoriesList = JSON.parse(localStorage.getItem('almalik_categories')) || [
            { id: 1, name: 'إلكترونيات', icon: 'fa-laptop', color: 'text-indigo-400', bg: 'bg-indigo-500/10' },
            { id: 2, name: 'أزياء', icon: 'fa-shirt', color: 'text-teal-400', bg: 'bg-teal-500/10' },
            { id: 3, name: 'تجميل', icon: 'fa-spray-can-sparkles', color: 'text-purple-400', bg: 'bg-purple-500/10' },
            { id: 4, name: 'المنزل', icon: 'fa-house-chimney', color: 'text-amber-400', bg: 'bg-amber-500/10' }
        ];

        let products = JSON.parse(localStorage.getItem('almalik_products')) || [
            { id: 1, name: 'آيفون 15 برو ماكس', price: 4500, category: 'إلكترونيات', image: 'https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=300' },
            { id: 2, name: 'ساعة ذكية رويال', price: 850, category: 'إلكترونيات', image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300' },
            { id: 3, name: 'جاكيت جلد ملكي', price: 350, category: 'أزياء', image: 'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=300' },
            { id: 4, name: 'عطر الملكة الفاخر', price: 500, category: 'تجميل', image: 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=300' }
        ];

        let orders = JSON.parse(localStorage.getItem('almalik_orders')) || [
            { id: '#1045', status: 'قيد التوصيل', total: 'SAR 5350', date: 'اليوم، 04:30 م', phone: '07801234567', address: 'حي الحسين، شارع الإسكان', landmark: 'قرب جامع الرسول' },
            { id: '#1044', status: 'تم التسليم', total: 'SAR 120', date: 'أمس', phone: '07709876543', address: 'حي العباس، قرب المدارس', landmark: 'مخبز البركة' }
        ];

        let uploadedImageBase64 = '';

        setInterval(() => {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('live-time').innerText = `${hours}:${minutes}`;
        }, 1000);

        function saveData() {
            localStorage.setItem('almalik_products', JSON.stringify(products));
            localStorage.setItem('almalik_categories', JSON.stringify(categoriesList));
            localStorage.setItem('almalik_admin_pin', adminPin);
            localStorage.setItem('almalik_orders', JSON.stringify(orders));
        }

        function tryOpenAdmin() {
            if (isAdminLoggedIn) {
                switchTab('admin');
            } else {
                let enteredPin = prompt('🔒 لوحة الإدارة محمية بررمز سري\nالرجاء إدخال الرمز السري (الافتراضي: 1234):');
                if (enteredPin === null) return;
                if (enteredPin === adminPin) {
                    isAdminLoggedIn = true;
                    switchTab('admin');
                } else {
                    alert('❌ الرمز السري غير صحيح! لا يمكنك الدخول لوحة الإدارة.');
                }
            }
        }

        function switchTab(tab) {
            if (tab === 'admin' && !isAdminLoggedIn) {
                tryOpenAdmin();
                return;
            }
            currentTab = tab;
            ['home', 'categories', 'cart'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tab) {
                        btn.classList.remove('text-slate-400');
                        btn.classList.add('text-indigo-400');
                    } else {
                        btn.classList.remove('text-indigo-400');
                        btn.classList.add('text-slate-400');
                    }
                }
            });
            renderContent();
            window.scrollTo(0, 0);
        }

        function renderContent() {
            const main = document.getElementById('main-content');
            updateBadge();
            
            if (currentTab === 'home') {
                main.innerHTML = `
                    <div class="space-y-5">
                        <div class="bg-gradient-to-r from-indigo-600 to-teal-600 rounded-2xl p-4 text-white shadow-lg relative overflow-hidden">
                            <div class="relative z-10">
                                <span class="bg-white/20 text-white font-bold px-2 py-0.5 rounded-lg text-[10px]">عرض حصري</span>
                                <h2 class="text-xl font-black mt-1.5">تخفيضات الملوك الكبرى</h2>
                                <p class="text-[11px] font-semibold mt-1 opacity-90">احصل على خصم يصل إلى 40% على جميع منتجات المتجر.</p>
                                <button onclick="switchTab('categories')" class="mt-3 bg-white text-indigo-900 font-bold px-3.5 py-1.5 rounded-xl text-xs shadow hover:bg-slate-100 transition">تسوق الآن</button>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-2.5">
                                <h3 class="font-bold text-xs text-slate-200">الأقسام الرئيسية</h3>
                                <button onclick="switchTab('categories')" class="text-xs text-indigo-400 font-semibold">عرض الكل</button>
                            </div>
                            <div class="grid grid-cols-4 gap-2">
                                ${categoriesList.map(cat => `
                                    <div onclick="switchTab('categories')" class="bg-[#0f172a] border border-slate-800/80 p-2.5 rounded-2xl flex flex-col items-center gap-1.5 cursor-pointer hover:border-indigo-500/50 transition">
                                        <div class="w-9 h-9 rounded-xl ${cat.bg} ${cat.color} flex items-center justify-center text-base"><i class="fa-solid ${cat.icon}"></i></div>
                                        <span class="text-[10px] font-semibold text-slate-300 truncate w-full text-center">${cat.name}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div>
                            <h3 class="font-bold text-xs text-slate-200 mb-2.5">المنتجات الأكثر مبيعاً</h3>
                            <div class="grid grid-cols-2 gap-2.5">
                                ${products.map(p => `
                                    <div class="bg-[#0f172a] border border-slate-800/80 rounded-2xl p-2.5 flex flex-col justify-between">
                                        <img src="${p.image}" class="w-full h-24 object-cover rounded-xl mb-2.5">
                                        <div>
                                            <h4 class="font-bold text-xs text-slate-100 truncate">${p.name}</h4>
                                            <p class="text-indigo-400 font-black text-xs mt-0.5">${p.price} SAR</p>
                                        </div>
                                        <button onclick="addToCart(${p.id})" class="mt-2.5 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-1.5 rounded-xl text-[11px] transition flex items-center justify-center gap-1">
                                            <i class="fa-solid fa-plus text-[9px]"></i> إضافة للسلة
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else if (currentTab === 'categories') {
                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="font-black text-base text-slate-100">أقسام ومنتجات المتجر</h2>
                        <div class="space-y-3">
                            ${categoriesList.map(cat => {
                                const catProducts = products.filter(p => p.category === cat.name);
                                return `
                                    <div class="bg-[#0f172a] border border-slate-800/80 p-3.5 rounded-2xl space-y-2.5">
                                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                                            <div class="flex items-center gap-2">
                                                <div class="w-7 h-7 rounded-lg ${cat.bg} ${cat.color} flex items-center justify-center text-sm"><i class="fa-solid ${cat.icon}"></i></div>
                                                <h3 class="font-bold text-xs text-white">${cat.name}</h3>
                                            </div>
                                            <span class="text-[11px] text-slate-400">${catProducts.length} منتج</span>
                                        </div>
                                        <div class="grid grid-cols-1 gap-2">
                                            ${catProducts.length === 0 ? '<p class="text-[11px] text-slate-500 py-1">لا توجد منتجات في هذا القسم حالياً.</p>' : 
                                              catProducts.map(p => `
                                                <div class="flex items-center justify-between bg-[#090d16] p-2 rounded-xl border border-slate-800/60">
                                                    <div class="flex items-center gap-2.5">
                                                        <img src="${p.image}" class="w-10 h-10 object-cover rounded-lg">
                                                        <div>
                                                            <h4 class="font-bold text-xs text-slate-200">${p.name}</h4>
                                                            <p class="text-indigo-400 font-bold text-[11px] mt-0.5">${p.price} SAR</p>
                                                        </div>
                                                    </div>
                                                    <button onclick="addToCart(${p.id})" class="bg-indigo-600 text-white px-2.5 py-1.5 rounded-lg font-bold text-xs hover:bg-indigo-500"><i class="fa-solid fa-plus"></i></button>
                                                </div>
                                              `).join('')
                                            }
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'cart') {
                let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
                main.innerHTML = `
                    <div class="space-y-4">
                        <h2 class="font-black text-base text-slate-100">سلة التسوق</h2>
                        ${cart.length === 0 ? `
                            <div class="text-center py-20 text-slate-500">
                                <i class="fa-solid fa-bag-shopping text-4xl mb-3"></i>
                                <p class="text-xs">السلة فارغة حالياً</p>
                            </div>
                        ` : `
                            <div class="space-y-2.5">
                                ${cart.map(item => `
                                    <div class="bg-[#0f172a] border border-slate-800/80 p-3 rounded-2xl flex items-center justify-between">
                                        <div class="flex items-center gap-2.5">
                                            <img src="${item.image}" class="w-11 h-11 object-cover rounded-xl">
                                            <div>
                                                <h4 class="font-bold text-xs text-slate-100">${item.name}</h4>
                                                <p class="text-indigo-400 font-black text-xs mt-0.5">${item.price} SAR</p>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2 bg-slate-800/80 px-2 py-1 rounded-xl">
                                            <button onclick="changeQty(${item.id}, -1)" class="text-slate-400 hover:text-white px-1"><i class="fa-solid fa-minus text-[10px]"></i></button>
                                            <span class="text-xs font-bold text-white">${item.qty}</span>
                                            <button onclick="changeQty(${item.id}, 1)" class="text-slate-400 hover:text-white px-1"><i class="fa-solid fa-plus text-[10px]"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="bg-[#0f172a] border border-slate-800/80 p-3.5 rounded-2xl space-y-3 mt-3">
                                <div class="flex justify-between text-xs">
                                    <span class="text-slate-400">المجموع الكلي:</span>
                                    <span class="font-black text-indigo-400 text-base">${total} SAR</span>
                                </div>
                                <button onclick="openCheckoutModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-lg">إتمام الطلب الآن</button>
                            </div>
                        `}
                    </div>
                `;
            } else if (currentTab === 'admin') {
                if (!isAdminLoggedIn) {
                    switchTab('home');
                    return;
                }
                main.innerHTML = `
                    <div class="space-y-5">
                        <div class="flex justify-between items-center">
                            <h2 class="font-black text-base text-slate-100">لوحة الإدارة (طلبات الزبائن)</h2>
                            <button onclick="logoutAdmin()" class="bg-rose-500/20 text-rose-400 text-xs px-3 py-1 rounded-xl font-bold hover:bg-rose-500/35">قفل اللوحة</button>
                        </div>

                        <!-- Orders Management Section -->
                        <div class="bg-[#0f172a] border border-slate-800/80 p-3.5 rounded-2xl space-y-3">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                                <h3 class="font-bold text-xs text-indigo-400 flex items-center gap-2">
                                    <i class="fa-solid fa-receipt"></i> طلبات الزبائن الواردة (${orders.length})
                                </h3>
                                <button onclick="clearAllOrders()" class="text-[10px] text-rose-400 hover:text-rose-300 font-semibold">حذف الكل</button>
                            </div>
                            <div class="space-y-2.5 max-h-60 overflow-y-auto">
                                ${orders.length === 0 ? '<p class="text-xs text-slate-500 text-center py-4">لا توجد طلبات جديدة حالياً.</p>' :
                                  orders.map((o, index) => `
                                    <div class="bg-[#090d16] p-3 rounded-xl border border-slate-800 space-y-2">
                                        <div class="flex justify-between items-center">
                                            <span class="font-bold text-xs text-white">${o.id}</span>
                                            <div class="flex items-center gap-2">
                                                <span class="text-[10px] px-2 py-0.5 rounded-full font-semibold ${o.status === 'قيد التوصيل' ? 'bg-indigo-500/20 text-indigo-300' : 'bg-emerald-500/20 text-emerald-300'}">${o.status}</span>
                                                <button onclick="deleteOrder(${index})" class="text-rose-400 hover:text-rose-300 text-xs"><i class="fa-solid fa-trash"></i></button>
                                            </div>
                                        </div>
                                        <div class="text-[11px] text-slate-300 space-y-1">
                                            <p><i class="fa-solid fa-phone text-indigo-400 ml-1"></i> <b>الهاتف:</b> ${o.phone}</p>
                                            <p><i class="fa-solid fa-location-dot text-indigo-400 ml-1"></i> <b>العنوان:</b> ${o.address}</p>
                                            <p><i class="fa-solid fa-map-pin text-indigo-400 ml-1"></i> <b>النقطة الدالة:</b> ${o.landmark}</p>
                                        </div>
                                        <div class="flex justify-between items-center text-[10px] text-slate-400 pt-1 border-t border-slate-800">
                                            <span>${o.date}</span>
                                            <span class="font-bold text-indigo-400">${o.total}</span>
                                        </div>
                                    </div>
                                  `).join('')
                                }
                            </div>
                        </div>
                        
                        <div class="bg-[#0f172a] border border-slate-800/80 p-3.5 rounded-2xl space-y-2.5">
                            <h3 class="font-bold text-xs text-indigo-400 flex items-center gap-2"><i class="fa-solid fa-shield-halved"></i> تغيير الرمز السري للإدارة</h3>
                            <div class="flex gap-2">
                                <input type="password" id="new-pin-input" placeholder="الرمز الجديد" class="flex-1 bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                                <button onclick="changeAdminPin()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition">تحديث</button>
                            </div>
                        </div>

                        <div class="bg-[#0f172a] border border-slate-800/80 p-3.5 rounded-2xl space-y-2.5">
                            <h3 class="font-bold text-xs text-indigo-400 flex items-center gap-2"><i class="fa-solid fa-folder-plus"></i> إدارة الأقسام (إضافة / حذف)</h3>
                            <div class="flex gap-2">
                                <input type="text" id="new-cat-name" placeholder="اسم القسم الجديد" class="flex-1 bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                                <button onclick="addNewCategory()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3.5 py-2 rounded-xl text-xs transition">إضافة</button>
                            </div>
                            <div class="space-y-1.5 pt-1">
                                <span class="text-[10px] text-slate-400">الأقسام الحالية:</span>
                                <div class="space-y-1 max-h-24 overflow-y-auto">
                                    ${categoriesList.map(cat => `
                                        <div class="flex items-center justify-between bg-[#090d16] px-2.5 py-1.5 rounded-xl border border-slate-800">
                                            <div class="flex items-center gap-2">
                                                <i class="fa-solid ${cat.icon} ${cat.color} text-xs"></i>
                                                <span class="text-xs font-semibold text-white">${cat.name}</span>
                                            </div>
                                            ${categoriesList.length > 1 ? `
                                                <button onclick="deleteCategory('${cat.name}')" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-0.5"><i class="fa-solid fa-trash"></i></button>
                                            ` : '<span class="text-[9px] text-slate-500">الرئيسي</span>'}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>

                        <div class="bg-[#0f172a] border border-slate-800/80 p-3.5 rounded-2xl space-y-2.5">
                            <h3 class="font-bold text-xs text-indigo-400 flex items-center gap-2"><i class="fa-solid fa-box-open"></i> إضافة منتج جديد + صورة</h3>
                            <input type="text" id="new-prod-name" placeholder="اسم المنتج" class="w-full bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                            <input type="number" id="new-prod-price" placeholder="السعر (SAR)" class="w-full bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                            
                            <div>
                                <label class="text-[10px] text-slate-300 block mb-1">القسم:</label>
                                <select id="new-prod-cat" class="w-full bg-[#090d16] border border-slate-700/80 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                                    ${categoriesList.map(cat => `<option value="${cat.name}">${cat.name}</option>`).join('')}
                                </select>
                            </div>

                            <div>
                                <label class="text-[10px] text-slate-300 block mb-1">صورة المنتج:</label>
                                <input type="file" id="prod-image-file" accept="image/*" onchange="handleImageUpload(event)" class="w-full bg-[#090d16] border border-slate-700/80 rounded-xl px-2.5 py-1.5 text-[11px] text-slate-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[10px] file:font-bold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                            </div>

                            <div id="image-preview-container" class="hidden">
                                <img id="uploaded-preview" class="w-16 h-16 object-cover rounded-xl border border-slate-700">
                            </div>

                            <button onclick="addNewProduct()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs transition shadow">حفظ وإضافة للمتجر</button>
                        </div>

                        <div class="bg-[#0f172a] border border-slate-800/80 p-3.5 rounded-2xl space-y-2.5">
                            <h3 class="font-bold text-xs text-slate-200 flex items-center gap-2"><i class="fa-solid fa-list-check"></i> قائمة المنتجات وحذفها</h3>
                            <div class="space-y-1.5 max-h-32 overflow-y-auto">
                                ${products.map(p => `
                                    <div class="flex items-center justify-between bg-[#090d16] p-2 rounded-xl border border-slate-800">
                                        <div class="flex items-center gap-2.5">
                                            <img src="${p.image}" class="w-9 h-9 object-cover rounded-lg">
                                            <div>
                                                <h4 class="font-bold text-xs text-white truncate w-28">${p.name}</h4>
                                                <span class="text-[10px] text-indigo-400">${p.price} SAR</span>
                                            </div>
                                        </div>
                                        <button onclick="deleteProduct(${p.id})" class="text-rose-400 hover:text-rose-300 text-xs px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function openCheckoutModal() {
            if (cart.length === 0) {
                alert('السلة فارغة!');
                return;
            }
            document.getElementById('checkout-modal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkout-modal').classList.add('hidden');
        }

        function submitOrderWithDetails() {
            const phone = document.getElementById('customer-phone').value.trim();
            const address = document.getElementById('customer-address').value.trim();
            const landmark = document.getElementById('customer-landmark').value.trim();

            if (!phone || !address || !landmark) {
                alert('الرجاء إدخال رقم الموبايل، العنوان، وأقرب نقطة دالة كاملة.');
                return;
            }

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const newOrderId = '#' + Math.floor(1000 + Math.random() * 9000);

            orders.unshift({
                id: newOrderId,
                status: 'قيد التوصيل',
                total: totalAmount + ' SAR',
                date: 'اليوم، ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                phone,
            address,
                landmark
            });

            saveData();
            cart = [];
            closeCheckoutModal();
            alert('🎉 تم إرسال طلبك بنجاح! سيتم التواصل معك عبر رقم الموبايل لتأكيد التوصيل.');
            switchTab('home');
        }

        function deleteOrder(index) {
            if (confirm('هل تريد حذف هذا الطلب؟')) {
                orders.splice(index, 1);
                saveData();
                renderContent();
            }
        }

        function clearAllOrders() {
            if (confirm('هل تريد حذف جميع الطلبات الواردة؟')) {
                orders = [];
                saveData();
                renderContent();
            }
        }

        function logoutAdmin() {
            isAdminLoggedIn = false;
            switchTab('home');
            alert('تم قفل لوحة الإدارة بأمان.');
        }

        function changeAdminPin() {
            const newPin = document.getElementById('new-pin-input').value.trim();
            if (newPin.length >= 3) {
                adminPin = newPin;
                saveData();
                document.getElementById('new-pin-input').value = '';
                alert('✅ تم تحديث الرمز السري للإدارة بنجاح!');
            } else {
                alert('الرجاء إدخال رمز سري مكون من 3 خانات على الأقل.');
            }
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageBase64 = e.target.result;
                    const preview = document.getElementById('uploaded-preview');
                    preview.src = uploadedImageBase64;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function addNewCategory() {
            const nameInput = document.getElementById('new-cat-name');
            const name = nameInput.value.trim();
            if (name) {
                if (categoriesList.some(c => c.name === name)) {
                    alert('هذا القسم موجود مسبقاً!');
                    return;
                }
                const icons = ['fa-bag-shopping', 'fa-gift', 'fa-star', 'fa-tag', 'fa-fire'];
                const randomIcon = icons[Math.floor(Math.random() * icons.length)];
                categoriesList.push({
                    id: categoriesList.length + 1,
                    name: name,
                    icon: randomIcon,
                    color: 'text-indigo-400',
                    bg: 'bg-indigo-500/10'
                });
                saveData();
                nameInput.value = codeOutput = '';
                nameInput.value = '';
                alert('تمت إضافة القسم بنجاح!');
                switchTab('admin');
            } else {
                alert('الرجاء إدخال اسم القسم');
            }
        }

        function deleteCategory(catName) {
            if (confirm(`هل أنت متأكد من حذف قسم "${catName}"؟`)) {
                categoriesList = categoriesList.filter(c => catName !== c.name);
                if (categoriesList.length > 0) {
                    products.forEach(p => {
                        if (p.category === catName) {
                            p.category = categoriesList[0].name;
                        }
                    });
                }
                saveData();
                alert('تم حذف القسم بنجاح');
                switchTab('admin');
            }
        }

        function addNewProduct() {
            const name = document.getElementById('new-prod-name').value.trim();
            const price = document.getElementById('new-prod-price').value.trim();
            const category = document.getElementById('new-prod-cat').value;

            if (name && price) {
                const image = uploadedImageBase64 || 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300';
                products.push({
                    id: products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1,
                    name,
                    price: Number(price),
                    category,
                    image
                });
                uploadedImageBase64 = '';
                saveData();
                alert('تمت إضافة المنتج بنجاح!');
                switchTab('home');
            } else {
                alert('الرجاء تعبئة اسم المنتج والسعر على الأقل');
            }
        }

        function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products = products.filter(p => p.id !== id);
                saveData();
                alert('تم حذف المنتج بنجاح');
                switchTab('admin');
            }
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            const exist = cart.find(item => item.id === id);
            if (exist) {
                exist.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            updateBadge();
            alert('تمت إضافة المنتج إلى السلة بنجاح!');
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            renderContent();
        }

        function updateBadge() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            const badge = document.getElementById('cart-badge');
            if(badge) badge.innerText = count;
        }

        renderContent();
    </script>
</body>
</html>
