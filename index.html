<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملك شوب - المتجر الرسمي</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:#f5f7f4;color:#111827;margin:0;padding-bottom:88px}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer}
.panel{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 4px 18px #00000008}
.btn-primary{background:#15803d;color:#fff}
.btn-primary:hover{background:#166534}
.btn-orange{background:#f97316;color:#fff}
.field{width:100%;border:1px solid #d1d5db;border-radius:12px;padding:10px 12px;background:#fff;color:#111827;outline:none;font-size:13px}
.field:focus{border-color:#16a34a;box-shadow:0 0 0 2px #16a34a22}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:4px;color:#6b7280;font-size:11px;padding:6px 10px}
.navbtn.active{color:#15803d;font-weight:800}
img{background:#f3f4f6}
</style>
</head>
<body>
<header class="sticky top-0 z-30 bg-white border-b border-gray-200 shadow-sm">
  <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-2xl bg-green-100 text-green-700 flex items-center justify-center text-2xl">👑</div>
      <div><h1 class="font-black text-lg text-gray-900">الملك شوب</h1><p class="text-xs text-green-700">تسوّق بسهولة وأمان</p></div>
    </div>
    <button onclick="switchTab('cart')" class="relative rounded-xl bg-orange-50 text-orange-600 px-3 py-2">
      <i class="fa-solid fa-cart-shopping"></i><span id="cart-badge" class="mr-1 font-bold">0</span>
    </button>
  </div>
</header>

<main id="main-content" class="max-w-lg mx-auto p-4"></main>

<div id="checkout-modal" class="hidden fixed inset-0 z-50 bg-black/60 p-4 flex items-center justify-center">
  <div class="bg-white rounded-3xl p-5 w-full max-w-sm space-y-3 shadow-xl">
    <div class="flex justify-between items-center"><h2 class="font-black text-green-800">بيانات التوصيل</h2><button onclick="closeCheckoutModal()" class="text-gray-500 text-xl" aria-label="إغلاق">×</button></div>
    <input id="customer-name" class="field" placeholder="الاسم الكامل">
    <input id="customer-phone" class="field" type="tel" placeholder="رقم الموبايل">
    <input id="customer-address" class="field" placeholder="المدينة، الحي، الشارع، الدار">
    <input id="customer-landmark" class="field" placeholder="أقرب نقطة دالة (اختياري)">
    <p class="text-xs text-gray-500">أجور التوصيل: 1000 دينار، وتُحسب من الخادم.</p>
    <button id="submit-order-btn" onclick="submitOrderWithDetails()" class="btn-primary w-full rounded-xl py-3 font-bold">تأكيد وإرسال الطلب</button>
  </div>
</div>

<nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-gray-200 shadow-lg">
  <div class="max-w-lg mx-auto flex justify-around">
    <button id="nav-home" class="navbtn active" onclick="switchTab('home')"><i class="fa-solid fa-house text-lg"></i>الرئيسية</button>
    <button id="nav-categories" class="navbtn" onclick="switchTab('categories')"><i class="fa-solid fa-layer-group text-lg"></i>الأقسام</button>
    <button id="nav-cart" class="navbtn" onclick="switchTab('cart')"><i class="fa-solid fa-bag-shopping text-lg"></i>السلة</button>
    <button id="nav-admin" class="navbtn" onclick="tryOpenAdmin()"><i class="fa-solid fa-lock text-lg"></i>الإدارة</button>
  </div>
</nav>

<script>
'use strict';
const API = '';
let currentTab = 'home';
let isAdminLoggedIn = false;
let adminToken = sessionStorage.getItem('almalik_admin_token') || '';
let products = [];
let orders = [];
let cart = [];
let categoriesList = JSON.parse(localStorage.getItem('almalik_categories') || 'null') || [
  {id:1,name:'إلكترونيات'},{id:2,name:'أزياء'},{id:3,name:'تجميل'},{id:4,name:'المنزل'}
];

function money(value){return Number(value || 0).toLocaleString('en-US') + ' د.ع';}
function safeText(value){return String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function productImage(p){return p.image_url || p.image || '';}
function saveCategories(){localStorage.setItem('almalik_categories',JSON.stringify(categoriesList));}
async function apiFetch(path, options={}) {
  const headers = new Headers(options.headers || {});
  if(options.body && !headers.has('Content-Type')) headers.set('Content-Type','application/json');
  if(options.admin && adminToken) headers.set('Authorization','Bearer '+adminToken);
  const response = await fetch(API + path, {...options, headers});
  let data={};
  try{data=await response.json();}catch{}
  if(!response.ok) throw new Error(data.error || `حدث خطأ (${response.status})`);
  return data;
}
async function loadProducts(showError=false){
  try{
    const data=await apiFetch('/api/products');
    products=(data.products || []).map(p=>({...p,id:Number(p.id),price:Number(p.price),stock:Number(p.stock||0),image:p.image_url||''}));
    renderContent();
  }catch(error){
    console.error(error);
    products=[];
    renderContent();
    if(showError) alert('تعذر تحميل المنتجات من الخادم. تحقق من نشر worker.js ثم أعد المحاولة.\n'+error.message);
  }
}
async function loadOrders(){
  if(!isAdminLoggedIn) return;
  try{
    const data=await apiFetch('/api/admin/orders',{admin:true});
    orders=(data.orders || []).map(o=>({...o,id:o.id,status:o.status||'جديد',total:Number(o.total||0),date:o.created_at||'',phone:o.phone||'',address:o.address||'',landmark:o.notes||'',items_summary:o.items_summary||''}));
  }catch(error){
    if(String(error.message).includes('تسجيل الدخول')){adminToken='';sessionStorage.removeItem('almalik_admin_token');isAdminLoggedIn=false;}
    alert('تعذر تحميل الطلبات: '+error.message);
  }
}
async function tryOpenAdmin(){
  if(isAdminLoggedIn){await loadOrders();switchTab('admin');return;}
  const pin=prompt('أدخل رمز إدارة المتجر:');
  if(pin===null)return;
  try{
    const data=await apiFetch('/api/admin/login',{method:'POST',body:JSON.stringify({pin})});
    adminToken=data.token;
    sessionStorage.setItem('almalik_admin_token',adminToken);
    isAdminLoggedIn=true;
    await loadOrders();
    switchTab('admin');
  }catch(error){alert('تعذر تسجيل الدخول: '+error.message+'\nتأكد من إعداد ADMIN_PIN و ADMIN_TOKEN في Cloudflare.');}
}
function logoutAdmin(){isAdminLoggedIn=false;adminToken='';sessionStorage.removeItem('almalik_admin_token');switchTab('home');}
function switchTab(tab){
  if(tab==='admin'&&!isAdminLoggedIn){tryOpenAdmin();return;}
  currentTab=tab;
  ['home','categories','cart','admin'].forEach(t=>{const b=document.getElementById('nav-'+t);if(b)b.classList.toggle('active',t===tab);});
  renderContent();window.scrollTo(0,0);
}
function updateBadge(){document.getElementById('cart-badge').textContent=cart.reduce((s,p)=>s+p.qty,0);}
function renderProductCard(p){
  const image=productImage(p);
  return `<article class="panel p-3 flex flex-col gap-2">
    ${image?`<img src="${safeText(image)}" alt="${safeText(p.name)}" class="w-full h-32 object-cover rounded-xl" onerror="this.style.display='none'">`:`<div class="w-full h-32 rounded-xl bg-green-50 text-green-700 flex items-center justify-center text-3xl"><i class="fa-solid fa-box"></i></div>`}
    <div class="flex-1"><h3 class="font-bold text-sm text-gray-900">${safeText(p.name)}</h3><p class="text-green-700 font-black mt-1">${money(p.price)}</p><p class="text-xs text-gray-500 mt-1">المتوفر: ${Number(p.stock||0)}</p></div>
    <button onclick="addToCart(${Number(p.id)})" class="btn-primary rounded-xl py-2 text-xs font-bold"><i class="fa-solid fa-plus ml-1"></i>إضافة للسلة</button>
  </article>`;
}
function renderContent(){
  const main=document.getElementById('main-content');updateBadge();
  if(currentTab==='home'){
    main.innerHTML=`<section class="rounded-3xl p-5 mb-5 text-white bg-gradient-to-l from-green-700 to-green-500">
      <span class="inline-block bg-white/20 rounded-lg px-2 py-1 text-xs">أهلاً بك في الملك شوب</span>
      <h2 class="text-2xl font-black mt-2">تسوّق كل ما تحتاجه</h2><p class="text-sm mt-2 text-white/90">منتجات وأسعار محدثة من قاعدة بيانات المتجر.</p>
      <button onclick="switchTab('categories')" class="btn-orange rounded-xl px-4 py-2 mt-4 font-bold text-sm">تصفح المنتجات</button></section>
      <div class="flex items-center justify-between mb-3"><h2 class="font-black text-gray-900">منتجات المتجر</h2><button onclick="loadProducts(true)" class="text-sm text-green-700 font-bold"><i class="fa-solid fa-rotate ml-1"></i>تحديث</button></div>
      ${products.length?`<div class="grid grid-cols-2 gap-3">${products.map(renderProductCard).join('')}</div>`:`<div class="panel p-6 text-center text-gray-500"><i class="fa-solid fa-box-open text-3xl text-green-600 mb-3"></i><p class="font-bold">لا توجد منتجات منشورة حالياً</p><p class="text-xs mt-2">سجّل الدخول إلى الإدارة وأضف منتجاتك.</p><button onclick="tryOpenAdmin()" class="btn-primary rounded-xl px-4 py-2 mt-4 text-sm">فتح الإدارة</button></div>`}`;
  }else if(currentTab==='categories'){
    main.innerHTML=`<h2 class="font-black text-lg mb-4">الأقسام والمنتجات</h2>${categoriesList.map(c=>{const list=products.filter(p=>p.category===c.name);return `<section class="panel p-3 mb-4"><h3 class="font-black text-green-800 border-b pb-2 mb-3">${safeText(c.name)} <span class="text-xs text-gray-500 font-normal">(${list.length})</span></h3>${list.length?`<div class="grid grid-cols-2 gap-3">${list.map(renderProductCard).join('')}</div>`:`<p class="text-sm text-gray-500">لا توجد منتجات في هذا القسم حالياً.</p>`}</section>`;}).join('')}${categoriesList.length===0?'<p class="text-gray-500">لا توجد أقسام حالياً.</p>':''}`;
  }else if(currentTab==='cart'){
    const total=cart.reduce((s,p)=>s+p.price*p.qty,0);
    main.innerHTML=`<h2 class="font-black text-lg mb-4">سلة التسوق</h2>${cart.length?`${cart.map(item=>`<div class="panel p-3 mb-3 flex items-center gap-3">${productImage(item)?`<img src="${safeText(productImage(item))}" class="w-16 h-16 rounded-xl object-cover" onerror="this.style.display='none'">`:`<div class="w-16 h-16 rounded-xl bg-green-50 flex items-center justify-center text-green-700"><i class="fa-solid fa-box"></i></div>`}<div class="flex-1"><h3 class="font-bold text-sm">${safeText(item.name)}</h3><p class="text-green-700 font-bold text-sm">${money(item.price)}</p><div class="flex items-center gap-3 mt-2"><button onclick="changeQty(${item.id},-1)" class="rounded-lg bg-gray-100 px-3 py-1">−</button><span class="font-bold">${item.qty}</span><button onclick="changeQty(${item.id},1)" class="rounded-lg bg-gray-100 px-3 py-1">+</button></div></div></div>`).join('')}<div class="panel p-4"><div class="flex justify-between font-black mb-3"><span>المجموع (قبل التوصيل)</span><span class="text-green-700">${money(total)}</span></div><p class="text-xs text-gray-500 mb-3">تضاف أجور التوصيل 1000 د.ع عند تسجيل الطلب.</p><button onclick="openCheckoutModal()" class="btn-primary w-full rounded-xl py-3 font-bold">إتمام الطلب</button></div>`:`<div class="panel p-10 text-center"><i class="fa-solid fa-bag-shopping text-4xl text-gray-300"></i><p class="mt-3 text-gray-500">السلة فارغة حالياً</p><button onclick="switchTab('categories')" class="btn-primary rounded-xl px-4 py-2 mt-4">تصفح المنتجات</button></div>`}`;
  }else if(currentTab==='admin'){
    if(!isAdminLoggedIn){currentTab='home';renderContent();return;}
    main.innerHTML=`<div class="flex items-center justify-between mb-4"><h2 class="font-black text-lg">إدارة المتجر</h2><button onclick="logoutAdmin()" class="rounded-xl bg-red-50 text-red-600 px-3 py-2 text-xs font-bold">تسجيل الخروج</button></div>
    <section class="panel p-4 mb-4"><h3 class="font-black text-green-800 mb-3"><i class="fa-solid fa-box-open ml-1"></i>إضافة منتج</h3>
      <input id="new-prod-name" class="field mb-2" placeholder="اسم المنتج">
      <input id="new-prod-price" type="number" min="0" class="field mb-2" placeholder="السعر بالدينار العراقي">
      <input id="new-prod-stock" type="number" min="0" class="field mb-2" placeholder="الكمية المتوفرة بالمخزون">
      <select id="new-prod-cat" class="field mb-2">${categoriesList.map(c=>`<option value="${safeText(c.name)}">${safeText(c.name)}</option>`).join('')}</select>
      <input id="new-prod-image" type="url" class="field mb-2" placeholder="رابط صورة المنتج (اختياري)">
      <textarea id="new-prod-description" class="field mb-3" rows="2" placeholder="وصف المنتج (اختياري)"></textarea>
      <button onclick="addNewProduct()" class="btn-primary w-full rounded-xl py-3 font-bold">حفظ المنتج في قاعدة البيانات</button>
    </section>
    <section class="panel p-4 mb-4"><div class="flex justify-between items-center mb-3"><h3 class="font-black text-green-800">المنتجات (${products.length})</h3><button onclick="loadProducts(true)" class="text-green-700 text-sm font-bold">تحديث</button></div>
      ${products.length?products.map(p=>`<div class="flex items-center gap-3 py-3 border-b last:border-0"><div class="flex-1"><p class="font-bold text-sm">${safeText(p.name)}</p><p class="text-xs text-gray-500">${money(p.price)} · المخزون ${Number(p.stock||0)}</p></div><button onclick="deleteProduct(${Number(p.id)})" class="text-red-600 bg-red-50 rounded-lg px-3 py-2 text-xs">حذف</button></div>`).join(''):'<p class="text-sm text-gray-500">لا توجد منتجات.</p>'}
    </section>
    <section class="panel p-4"><div class="flex justify-between items-center mb-3"><h3 class="font-black text-green-800">طلبات الزبائن (${orders.length})</h3><button onclick="refreshOrders()" class="text-green-700 text-sm font-bold">تحديث</button></div>
      ${orders.length?orders.map(o=>`<article class="border rounded-xl p-3 mb-3"><div class="flex justify-between gap-2"><b class="text-sm">طلب #${safeText(o.id)}</b><span class="text-xs font-bold text-orange-600">${safeText(o.status)}</span></div><p class="text-xs mt-2">الاسم: ${safeText(o.customer_name||'—')}</p><p class="text-xs mt-1">الهاتف: ${safeText(o.phone)}</p><p class="text-xs mt-1">العنوان: ${safeText(o.address)}</p><p class="text-xs mt-1">المحتويات: ${safeText(o.items_summary)}</p><p class="font-black text-green-700 text-sm mt-2">الإجمالي: ${money(o.total)}</p><div class="flex gap-2 mt-3"><select id="status-${Number(o.id)}" class="field flex-1 text-xs"><option ${o.status==='جديد'?'selected':''}>جديد</option><option ${o.status==='قيد التجهيز'?'selected':''}>قيد التجهيز</option><option ${o.status==='تم التوصيل'?'selected':''}>تم التوصيل</option><option ${o.status==='ملغي'?'selected':''}>ملغي</option></select><button onclick="updateOrderStatus(${Number(o.id)})" class="btn-orange rounded-xl px-3 text-xs font-bold">تحديث الحالة</button></div></article>`).join(''):'<p class="text-sm text-gray-500">لا توجد طلبات في قاعدة البيانات.</p>'}
    </section>`;
  }
}
function addToCart(id){
  const p=products.find(x=>Number(x.id)===Number(id));if(!p)return;
  const existing=cart.find(x=>Number(x.id)===Number(id));
  if(existing){if(existing.qty>=Number(p.stock||0)){alert('الكمية المطلوبة غير متوفرة بالمخزون.');return;}existing.qty++;}
  else{if(Number(p.stock||0)<1){alert('هذا المنتج غير متوفر حالياً.');return;}cart.push({...p,qty:1});}
  updateBadge();alert('تمت إضافة المنتج إلى السلة.');if(currentTab==='cart')renderContent();
}
function changeQty(id,delta){
  const item=cart.find(x=>Number(x.id)===Number(id));if(!item)return;
  const p=products.find(x=>Number(x.id)===Number(id));
  item.qty+=delta;
  if(item.qty<=0)cart=cart.filter(x=>Number(x.id)!==Number(id));
  else if(p&&item.qty>Number(p.stock||0)){item.qty=Number(p.stock||0);alert('لا توجد كمية إضافية في المخزون.');}
  renderContent();
}
function openCheckoutModal(){if(!cart.length){alert('السلة فارغة.');return;}document.getElementById('checkout-modal').classList.remove('hidden');}
function closeCheckoutModal(){document.getElementById('checkout-modal').classList.add('hidden');}
async function submitOrderWithDetails(){
  const name=document.getElementById('customer-name').value.trim();
  const phone=document.getElementById('customer-phone').value.trim();
  const address=document.getElementById('customer-address').value.trim();
  const landmark=document.getElementById('customer-landmark').value.trim();
  if(!name||!phone||!address){alert('يرجى إدخال الاسم ورقم الهاتف والعنوان.');return;}
  const button=document.getElementById('submit-order-btn');button.disabled=true;button.textContent='جارٍ إرسال الطلب...';
  try{
    const data=await apiFetch('/api/orders',{method:'POST',body:JSON.stringify({customer_name:name,phone,address,notes:landmark,items:cart.map(p=>({product_id:Number(p.id),quantity:Number(p.qty)}))})});
    cart=[];closeCheckoutModal();
    ['customer-name','customer-phone','customer-address','customer-landmark'].forEach(id=>document.getElementById(id).value='');
    alert('تم إرسال طلبك بنجاح. رقم الطلب: '+data.order_id);
    await loadProducts();switchTab('home');
  }catch(error){alert('لم يتم إرسال الطلب: '+error.message+'\nتحقق من توفر المنتجات والمخزون ثم حاول مجدداً.');}
  finally{button.disabled=false;button.textContent='تأكيد وإرسال الطلب';}
}
async function addNewProduct(){
  const name=document.getElementById('new-prod-name').value.trim();
  const price=Number(document.getElementById('new-prod-price').value);
  const stock=Number(document.getElementById('new-prod-stock').value);
  const category=document.getElementById('new-prod-cat').value;
  const image_url=document.getElementById('new-prod-image').value.trim();
  const description=document.getElementById('new-prod-description').value.trim();
  if(!name||document.getElementById('new-prod-price').value.trim()===''||!Number.isFinite(price)||price<0||!Number.isFinite(stock)||stock<0){alert('أدخل اسم المنتج وسعراً وكمية مخزون صحيحة.');return;}
  try{
    await apiFetch('/api/admin/products',{method:'POST',admin:true,body:JSON.stringify({name,price,stock:Math.floor(stock),category,image_url,description})});
    ['new-prod-name','new-prod-price','new-prod-stock','new-prod-image','new-prod-description'].forEach(id=>document.getElementById(id).value='');
    await loadProducts(true);alert('تم حفظ المنتج في قاعدة البيانات المشتركة.');switchTab('admin');
  }catch(error){alert('تعذر حفظ المنتج: '+error.message+'\nتأكد من تسجيل الدخول وصلاحيات الإدارة.');}
}
async function deleteProduct(id){
  if(!confirm('هل تريد إخفاء هذا المنتج من المتجر؟'))return;
  try{await apiFetch('/api/admin/products/'+Number(id),{method:'DELETE',admin:true});await loadProducts(true);alert('تم حذف المنتج من واجهة المتجر.');switchTab('admin');}
  catch(error){alert('تعذر حذف المنتج: '+error.message);}
}
async function refreshOrders(){await loadOrders();renderContent();}
async function updateOrderStatus(id){
  const select=document.getElementById('status-'+id);if(!select)return;
  try{await apiFetch('/api/admin/orders/'+id,{method:'PATCH',admin:true,body:JSON.stringify({status:select.value})});await loadOrders();renderContent();alert('تم تحديث حالة الطلب.');}
  catch(error){alert('تعذر تحديث حالة الطلب: '+error.message);}
}
async function addNewCategory(){
  const name=prompt('اكتب اسم القسم الجديد:');if(!name||!name.trim())return;
  if(categoriesList.some(c=>c.name===name.trim())){alert('هذا القسم موجود مسبقاً.');return;}
  categoriesList.push({id:Date.now(),name:name.trim()});saveCategories();renderContent();
}
function deleteCategory(name){
  if(!confirm('حذف القسم من قائمة الأقسام المحلية؟'))return;
  categoriesList=categoriesList.filter(c=>c.name!==name);saveCategories();renderContent();
}
async function changeAdminPin(){alert('يتم ضبط رمز الإدارة من إعدادات Cloudflare Worker باستخدام ADMIN_PIN، وليس من المتصفح.');}
function clearAllOrders(){alert('حذف الطلبات غير متاح من الواجهة الحالية للمحافظة على سجل الطلبات في قاعدة البيانات.');}
function deleteOrder(){alert('حذف الطلبات غير متاح من الواجهة الحالية للمحافظة على سجل الطلبات في قاعدة البيانات.');}

renderContent();
loadProducts(true);
</script>
</body>
</html>
